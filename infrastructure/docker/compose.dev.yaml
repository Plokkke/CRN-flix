# Local sandbox dependencies only (COOKBOOK §2): the engine itself runs with `pnpm dev`.
# Nothing here is reachable from outside the machine.
name: crn-flix-dev

services:
  postgres:
    # renovate: datasource=docker depName=postgres
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: crn_flix
      POSTGRES_PASSWORD: crn_flix_local
      POSTGRES_DB: crn_flix
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crn_flix -d crn_flix"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies components/database/src/scripts like in production.
  migrations:
    build:
      context: ../..
      dockerfile: components/database/migration/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: crn_flix
      DATABASE_URL: postgresql://crn_flix:crn_flix_local@postgres:5432/crn_flix

  # The player, on the fake library of .sandbox/medias (pnpm sandbox:library), same version as production.
  jellyfin:
    # renovate: datasource=docker depName=jellyfin/jellyfin
    # Same release as production (12.1.0).
    image: jellyfin/jellyfin:12.1.20260915-010956
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ../../.sandbox/medias:/medias
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  jellyfin-config:
  jellyfin-cache:
