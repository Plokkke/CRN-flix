# Requests a deployment; the deployer on the Raspberry Pi applies infrastructure/terraform
# at that version and reports the status in the Deployments tab. Rollback: run it with an older version.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy (X.Y.Z); empty keeps the deployed version with the current infrastructure
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
  push:
    branches: [main]
    paths: [infrastructure/**]

permissions:
  deployments: write
  contents: read

concurrency: deploy-production

jobs:
  # A push deploys the running version with the new infrastructure: only right when the push
  # changes nothing else. A push that also changes code is deployed by the release, image and
  # infrastructure together — the old image never runs on the new configuration.
  scope:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && inputs.version == ''
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" != push ] || [ -n "$VERSION" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          outside=$(git diff --name-only "$BEFORE" "$AFTER" | grep -v '^infrastructure/' || true)
          if [ -n "$outside" ]; then
            printf 'Not infrastructure-only, the release deploys it:\n%s\n' "$outside"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  request:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    uses: Plokkke/ci-shared/.github/workflows/request-deploy.yml@v1
    with:
      version: ${{ inputs.version }}
