name: Validate Components

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  TF_VERSION: '1.7.0'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      has_infra_changes: ${{ steps.changes.outputs.has_infra_changes }}
      has_docs_changes: ${{ steps.changes.outputs.has_docs_changes }}
      components: ${{ steps.changes.outputs.components }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Detect component changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python3 .github/scripts/detect_changes.py --force-all
          else
            python3 .github/scripts/detect_changes.py \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          fi

  validate-components:
    name: Validate ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.components) != '[]'
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.components) }}
      fail-fast: false
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'components/${{ matrix.component }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run --if-present lint

      - name: Run tests
        run: npm run --if-present test

      - name: Build application
        run: npm run build

      - name: Setup Docker Buildx
        if: hashFiles('components/${{ matrix.component }}/Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: hashFiles('components/${{ matrix.component }}/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: components/${{ matrix.component }}
          file: components/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: crn-flix-${{ matrix.component }}:pr-${{ github.event.number || 'manual' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.has_infra_changes == 'true'
    needs: detect-changes
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-components, validate-infrastructure]
    if: always()
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Setup Python for validation summary
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validation summary and PR comment
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          # Prepare job results JSON
          job_results='{
            "validate_components": "${{ needs.validate-components.result }}",
            "validate_infrastructure": "${{ needs.validate-infrastructure.result }}",
          }'
          
          # Prepare change data JSON
          change_data='{
            "has_changes": "${{ needs.detect-changes.outputs.has_changes }}",
            "components": ${{ needs.detect-changes.outputs.components }},
            "has_infra_changes": "${{ needs.detect-changes.outputs.has_infra_changes }}",
            "has_docs_changes": "${{ needs.detect-changes.outputs.has_docs_changes }}"
          }'
          
          # Use our Python script for validation summary
          python3 .github/scripts/validation_summary.py \
            "$job_results" \
            "$change_data" \
            --post-comment