name: Validate Components

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.changes.outputs.components }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
      infrastructure-changed: ${{ steps.changes.outputs.infrastructure-changed }}
      root-changed: ${{ steps.changes.outputs.root-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect component changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - validate all components
            components=$(find components -maxdepth 1 -type d -not -path components | sed 's|components/||' | jq -R -s -c 'split("\n")[:-1]')
            has_changes="true"
            infrastructure_changed="true"
            root_changed="true"
          else
            # PR trigger - detect changed files
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            
            changed_files=$(git diff --name-only $base_sha $head_sha)
            components=""
            infrastructure_changed="false"
            root_changed="false"
            
            # Check each component directory (excluding infrastructure and root)
            for component in $(find components -maxdepth 1 -type d -not -path components | sed 's|components/||'); do
              if echo "$changed_files" | grep -q "^components/$component/"; then
                components="$components,$component"
              fi
            done
            
            # Check if terraform infrastructure changed
            if echo "$changed_files" | grep -q "^terraform/"; then
              infrastructure_changed="true"
            fi
            
            # Check if root files changed
            if echo "$changed_files" | grep -qE "^(package\.json|\.nvmrc|scripts/|\.github/workflows/)"; then
              root_changed="true"
            fi
            
            # Convert to JSON array (only real components)
            if [[ -n "$components" ]]; then
              components=$(echo "$components" | sed 's/^,//' | tr ',' '\n' | sort -u | jq -R -s -c 'split("\n")[:-1]')
              has_changes="true"
            else
              components="[]"
              # Check if we have any changes at all
              if [[ "$infrastructure_changed" == "true" || "$root_changed" == "true" ]]; then
                has_changes="true"
              else
                has_changes="false"
              fi
            fi
          fi
          
          echo "components=$components" >> $GITHUB_OUTPUT
          echo "has-changes=$has_changes" >> $GITHUB_OUTPUT
          echo "infrastructure-changed=$infrastructure_changed" >> $GITHUB_OUTPUT
          echo "root-changed=$root_changed" >> $GITHUB_OUTPUT
          echo "Detected components: $components"
          echo "Infrastructure changed: $infrastructure_changed"
          echo "Root changed: $root_changed"

  validate-components:
    name: Validate ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.components) != '[]'
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.components) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'components/${{ matrix.component }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run --if-present lint

      - name: Run tests
        run: npm run --if-present test

      - name: Build application
        run: npm run build

      - name: Setup Docker Buildx
        if: hashFiles('components/${{ matrix.component }}/Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: hashFiles('components/${{ matrix.component }}/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: components/${{ matrix.component }}
          file: components/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          tags: crn-flix-${{ matrix.component }}:pr-${{ github.event.number || 'manual' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.infrastructure-changed == 'true'
    needs: detect-changes
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  validate-root:
    name: Validate Root
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.root-changed == 'true'
    needs: detect-changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate versions
        run: npm run version:check

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-components, validate-infrastructure, validate-root]
    if: always()
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check validation results
        run: |
          if [[ "${{ needs.detect-changes.outputs.has-changes }}" == "false" ]]; then
            echo "✅ No changes detected - validation skipped"
          else
            echo "🔍 Checking validation results..."
            
            # Check component validation
            if [[ "${{ needs.validate-components.result }}" == "success" ]]; then
              echo "✅ Components: passed"
            elif [[ "${{ needs.validate-components.result }}" == "skipped" ]]; then
              echo "ℹ️  Components: skipped"
            else
              echo "❌ Components: failed"
              exit 1
            fi
            
            # Check infrastructure validation
            if [[ "${{ needs.validate-infrastructure.result }}" == "success" ]]; then
              echo "✅ Infrastructure: passed"
            elif [[ "${{ needs.validate-infrastructure.result }}" == "skipped" ]]; then
              echo "ℹ️  Infrastructure: skipped"
            else
              echo "❌ Infrastructure: failed"
              exit 1
            fi
            
            # Check root validation
            if [[ "${{ needs.validate-root.result }}" == "success" ]]; then
              echo "✅ Root: passed"
            elif [[ "${{ needs.validate-root.result }}" == "skipped" ]]; then
              echo "ℹ️  Root: skipped"
            else
              echo "❌ Root: failed"
              exit 1
            fi
            
            echo "✅ All validations completed successfully"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has-changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const components = JSON.parse('${{ needs.detect-changes.outputs.components }}');
            const infraChanged = '${{ needs.detect-changes.outputs.infrastructure-changed }}' === 'true';
            const rootChanged = '${{ needs.detect-changes.outputs.root-changed }}' === 'true';
            
            const componentResult = '${{ needs.validate-components.result }}';
            const infraResult = '${{ needs.validate-infrastructure.result }}';
            const rootResult = '${{ needs.validate-root.result }}';
            
            const allSuccess = (componentResult === 'success' || componentResult === 'skipped') &&
                              (infraResult === 'success' || infraResult === 'skipped') &&
                              (rootResult === 'success' || rootResult === 'skipped');
            
            const emoji = allSuccess ? '✅' : '❌';
            const status = allSuccess ? 'passed' : 'failed';
            
            let validationDetails = '';
            
            if (components.length > 0) {
              validationDetails += `**Components:** ${components.join(', ')} (${componentResult})\n`;
            }
            if (infraChanged) {
              validationDetails += `**Infrastructure:** ${infraResult}\n`;
            }
            if (rootChanged) {
              validationDetails += `**Root:** ${rootResult}\n`;
            }
            
            const successMessage = '🎉 All validation checks passed! This PR is ready for review.';
            const failureMessage = '⚠️  Some validation checks failed. Please review the logs and fix any issues.';
            const statusMessage = allSuccess ? successMessage : failureMessage;
            
            const titleCase = status.charAt(0).toUpperCase() + status.slice(1);
            const body = `## ${emoji} Validation ${titleCase}\n\n${validationDetails}\n${statusMessage}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });