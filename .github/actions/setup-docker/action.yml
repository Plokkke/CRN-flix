name: 'Setup Docker Buildx'
description: 'Setup Docker Buildx with consistent configuration'
inputs:
  platforms:
    description: 'Docker platforms to support'
    required: false
    default: 'linux/amd64,linux/arm64'

runs:
  using: 'composite'
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: ${{ inputs.platforms }}